<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Night — Display</title>
<style>
  :root {
    --felt-1: #161616;
    --felt-2: #000000;
    --card: rgba(255, 255, 255, 0.06);
    --card-line: rgba(255, 255, 255, 0.10);
    --ink: #f4efe2;
    --muted: rgba(244, 239, 226, 0.62);
    --gold: #e8c26a;
    --hot-2: #f0a63a;
    --hot-3: #ff5a4e;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 30%, var(--felt-1), var(--felt-2) 75%);
    overflow: hidden;
    font-variant-numeric: tabular-nums;
    cursor: none;
  }
  .hidden { display: none !important; }

  /* ---------- start gate ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 100; cursor: pointer;
    display: grid; place-content: center; text-align: center; gap: 2vh;
    background: rgba(0, 0, 0, 0.82);
  }
  #gate h1 { font-size: 5vw; }
  #gate p { font-size: 1.6vw; color: var(--muted); }

  /* ---------- table view ---------- */
  #table { height: 100vh; display: grid; grid-template-columns: 1fr 26vw; }

  #board {
    position: relative; overflow: hidden; display: flex; align-items: center; min-width: 0;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 2.5vw, #000 calc(100% - 2.5vw), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 2.5vw, #000 calc(100% - 2.5vw), transparent 100%);
  }
  #board.static { justify-content: center; }
  #track { display: flex; gap: 1.4vw; padding: 1.5vh 2.5vw; width: max-content; will-change: transform; }
  .set { display: grid; grid-template-rows: repeat(var(--tile-rows, 2), 26vh); grid-auto-flow: column; grid-auto-columns: 22vw; gap: 2.4vh 1.4vw; }
  .tile {
    container-type: size;
    background: var(--card); border: 1px solid var(--card-line); border-radius: 1.2vw;
    padding: 2.6vh 1.5vw;
    display: grid; grid-template-columns: 1fr auto; grid-template-rows: 1fr auto; column-gap: 1vw;
  }
  .tile .name { grid-area: 1 / 1; font-size: min(11cqw, 22cqh); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .amt { grid-area: 2 / 1; font-size: min(8cqw, 15cqh); font-weight: 700; color: var(--muted); }
  .tile .mid { grid-area: 1 / 2 / 3 / 3; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .tile .n { font-size: min(34cqw, 72cqh); font-weight: 900; line-height: 0.85; }
  .tile .unit { font-size: min(4.5cqw, 9cqh); letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-top: 3cqh; }
  .tile.heat-2 .n { color: var(--hot-2); }
  .tile.heat-3 .n { color: var(--hot-3); }
  .tile.top { border-color: rgba(232, 194, 106, 0.6); }
  .tile.top .name { color: var(--gold); }
  .tile.zero { opacity: 0.45; }
  .tile { position: relative; }
  .tile.cement {
    background-color: #3b3a37;
    background-image:
      radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1.2px),
      radial-gradient(rgba(0, 0, 0, 0.35) 1px, transparent 1.2px),
      linear-gradient(135deg, #4a4945, #2c2b29);
    background-size: 7px 7px, 11px 11px, 100% 100%;
    background-position: 0 0, 3px 5px, 0 0;
    border: 2px solid #8b877e;
  }
  .tile.cement .name, .tile.cement .n { color: #d9d4c9; }
  .tile.out { opacity: 0.62; border-style: dashed; }
  .tile.out .n { color: var(--muted); }
  .tile.out .amt { grid-column: 1 / 3; color: var(--ink); font-size: min(7cqw, 14cqh); white-space: nowrap; }
  .tile.out .mid { grid-area: 1 / 2 / 2 / 3; }
  .tile.out .n { font-size: min(26cqw, 50cqh); }
  .net.pos { color: #3ad07a; }
  .net.neg { color: var(--hot-3); }
  .tile.out::after {
    content: "CASHED OUT" !important;
    background: #3ad07a !important; color: #04170c !important;
  }
  .tile.cement::after, .tile.out::after {
    content: "🧱 CEMENTED";
    position: absolute; top: 0; right: 1.2vw; transform: translateY(-50%);
    font-size: 0.85vw; font-weight: 800; letter-spacing: 0.14em;
    padding: 0.5vh 0.7vw; border-radius: 99px;
    background: #8b877e; color: #141412;
  }
  .tile.bump { animation: bump 1.4s ease; }
  @keyframes bump {
    0%, 100% { background: var(--card); }
    20% { background: rgba(232, 194, 106, 0.32); }
  }

  aside {
    background: rgba(255, 255, 255, 0.035); border-left: 1px solid var(--card-line);
    padding: 6vh 2.4vw; display: flex; flex-direction: column; gap: 4.5vh; min-height: 0; overflow: hidden;
  }
  .brand { font-size: 1.6vw; font-weight: 800; }
  #playing { font-size: 1.15vw; color: var(--muted); margin-top: 0.6vh; }
  #playing b { color: var(--ink); }
  .brand .suits { color: var(--gold); margin-right: 0.5vw; }
  .stat .label, .award .label {
    font-size: 0.95vw; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6vh;
  }
  .stat .v { font-size: 3.2vw; font-weight: 800; line-height: 1.05; }
  .stat .v.gold { color: var(--gold); font-size: 4.6vw; }
  .stat .v.gold.three { font-size: 3.4vw; }
  .stat .sub { font-size: 1.15vw; color: var(--muted); margin-top: 0.4vh; line-height: 1.5; }
  .stat .sub b { color: var(--ink); }
  .awards { display: flex; flex-direction: column; gap: 2.6vh; margin-top: auto; }
  .award .who { font-size: 1.8vw; font-weight: 700; }
  .award .who span { color: var(--gold); margin-left: 0.5vw; }
  .empty { grid-row: 1 / -1; display: grid; place-content: center; text-align: center; font-size: 2.2vw; color: var(--muted); }

  /* ---------- lobby / welcome ---------- */
  #lobby {
    height: 100vh; display: grid; place-content: center; text-align: center; gap: 3.5vh; padding: 4vw;
  }
  #lobby .suits { font-size: 4vw; letter-spacing: 1.2vw; color: var(--gold); }
  #lobby h1 { font-size: 9vw; font-weight: 900; line-height: 1; letter-spacing: -0.02em; }
  #lobby .date { font-size: 2.2vw; color: var(--muted); }
  #lobby .terms { font-size: 2.4vw; }
  #lobby .terms b { color: var(--gold); }
  #lobby .here-label { font-size: 1.2vw; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); margin-top: 2vh; }
  #lobby .here { display: flex; flex-wrap: wrap; justify-content: center; gap: 1vw; max-width: 80vw; }
  #lobby .here span {
    font-size: 2vw; font-weight: 600; padding: 0.8vh 1.6vw; border-radius: 99px;
    background: var(--card); border: 1px solid var(--card-line); animation: popin 0.5s ease both;
  }
  #lobby .url { position: fixed; bottom: 2vh; left: 0; right: 0; font-size: 1vw; color: var(--muted); }
  @keyframes popin { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ---------- scene overlay ---------- */
  #scene {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-content: center; text-align: center; gap: 3vh; padding: 5vw;
    background: var(--scene-bg, #111);
  }
  #scene.show { animation: scenein 0.45s cubic-bezier(.2,1.4,.4,1) both; }
  #scene.leaving { animation: sceneout 0.35s ease both; }
  @keyframes scenein { from { opacity: 0; transform: scale(1.15); } to { opacity: 1; transform: scale(1); } }
  @keyframes sceneout { to { opacity: 0; transform: scale(0.96); } }
  #scene .kicker { font-size: 2.6vw; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; }
  #scene .title.long { font-size: 6.5vw; }
  #scene .title.longer { font-size: 4.8vw; }
  #scene .title { font-size: 9vw; font-weight: 900; line-height: 0.95; letter-spacing: -0.02em; text-transform: none; }
  #scene .subtitle { font-size: 3.2vw; opacity: 0.85; }
  #scene .media img, #scene .media video { max-height: 48vh; max-width: 80vw; border-radius: 1.2vw; }
  #scene .bar { position: fixed; left: 0; bottom: 0; height: 1vh; background: rgba(255,255,255,0.55); width: 100%; transform-origin: left; }
  #scene.theme-red    { --scene-bg: radial-gradient(circle, #b3171b, #3d0406 80%); }
  #scene.theme-gold   { --scene-bg: radial-gradient(circle, #b8860b, #3b2a03 80%); }
  #scene.theme-green  { --scene-bg: radial-gradient(circle, #188a4f, #052716 80%); }
  #scene.theme-blue   { --scene-bg: radial-gradient(circle, #1f4f9e, #08142e 80%); }
  #scene.theme-purple { --scene-bg: radial-gradient(circle, #6b2fb3, #1b0833 80%); }
  #scene.theme-black  { --scene-bg: radial-gradient(circle, #2a2a2a, #000 80%); }
  #scene.theme-red .title { animation: pulse 0.6s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); text-shadow: 0 0 4vw rgba(255,200,200,0.6); } }

  .confetti { position: fixed; top: -5vh; width: 1vw; height: 1.8vw; z-index: 60; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }

  /* ---------- shot clock ---------- */
  #clock {
    position: fixed; inset: 0; z-index: 70; display: grid; place-content: center; text-align: center;
    background: radial-gradient(circle, #1b1b1b, #000 80%);
  }
  #clock .who { font-size: 3.6vw; font-weight: 700; color: var(--muted); }
  #clock .left { font-size: 34vh; font-weight: 900; line-height: 1; }
  #clock.urgent .left { color: var(--hot-3); animation: pulse 0.5s ease-in-out infinite alternate; }
  #clock.done { background: radial-gradient(circle, #b3171b, #3d0406 80%); }

  #conn { position: fixed; right: 1vw; bottom: 1vh; width: 0.8vw; height: 0.8vw; border-radius: 50%; background: #3ad07a; opacity: 0.5; z-index: 90; }
  #conn.off { background: #ff4d4d; opacity: 1; }
</style>
</head>
<body>

<div id="gate">
  <h1>♠ ♥ Poker Night ♦ ♣</h1>
  <p>Click anywhere to start — turns on sound, full screen and keeps the screen awake.</p>
  <p id="gate-url"></p>
</div>

<section id="lobby" class="hidden">
  <div class="suits">♠♥♦♣</div>
  <h1 id="lobby-title">Poker Night</h1>
  <div class="date" id="lobby-date"></div>
  <div class="terms" id="lobby-terms"></div>
  <div class="here-label" id="here-label">At the table</div>
  <div class="here" id="here"></div>
  <div class="url" id="lobby-url"></div>
</section>

<section id="table" class="hidden">
  <main id="board"><div id="track"></div></main>
  <aside>
    <div><div class="brand"><span class="suits">♠♥</span><span id="brand"></span></div><div class="sub" id="playing">Playing <b id="elapsed">0:00</b> · <span id="now"></span></div></div>
    <div class="stat"><div class="label">Blinds</div><div class="v gold" id="blinds"></div><div class="sub" id="buyin-terms"></div></div>
    <div class="stat"><div class="label">On the table</div><div class="v" id="total-money"></div><div class="sub" id="total-sub"></div></div>
    <div class="awards" id="awards"></div>
  </aside>
</section>

<div id="scene" class="hidden">
  <div class="media" id="scene-media"></div>
  <div class="kicker" id="scene-kicker"></div>
  <div class="title" id="scene-title"></div>
  <div class="subtitle" id="scene-subtitle"></div>
  <div class="bar" id="scene-bar"></div>
</div>

<div id="clock" class="hidden">
  <div class="who" id="clock-who"></div>
  <div class="left" id="clock-left"></div>
</div>

<div id="conn" class="off"></div>

<script src="/sounds.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Number(n).toLocaleString('en-IN');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let S = null;     // server state
  let M = null;     // meta (config bits)
  const prevBuyins = new Map();

  // ---------- start gate ----------
  let wakeLock = null;
  async function keepAwake() {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wakeLock) keepAwake(); });

  $('gate').addEventListener('click', () => {
    Sounds.unlock();
    document.documentElement.requestFullscreen?.().catch(() => {});
    keepAwake();
    $('gate').classList.add('hidden');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
    }
    if (e.key === 'Escape') clearFx();
  });

  // ---------- render ----------
  function render() {
    if (!S) return;
    const lobby = S.mode === 'lobby';
    $('lobby').classList.toggle('hidden', !lobby);
    $('table').classList.toggle('hidden', lobby);
    const terms = `${M.currency}${fmt(M.buyIn)} buy-in = ${fmt(M.chipsPerBuyIn)} chips`;
    const url = M.controlUrls[0] ? `Control from your phone: ${M.controlUrls[0]}` : '';
    $('gate-url').textContent = url;

    if (lobby) {
      $('lobby-title').textContent = M.title;
      $('lobby-date').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
      $('lobby-terms').innerHTML = `Blinds <b>${blindsText()}</b> · ${esc(terms)}`;
      $('here-label').textContent = S.players.length ? `At the table · ${S.players.length}` : 'Waiting for players…';
      $('here').innerHTML = S.players.map((p) => `<span>${esc(p.name)}</span>`).join('');
      $('lobby-url').textContent = url;
      return;
    }

    $('brand').textContent = M.title;
    $('blinds').textContent = blindsText();
    $('blinds').classList.toggle('three', Boolean(S.blinds.straddle));
    $('buyin-terms').textContent = terms;

    const n = S.players.length;
    try {
      renderTiles();
    } catch (err) {
      console.error('tiles', err); // never let the strip take the sidebar down with it
    }
    prevBuyins.clear();
    for (const p of S.players) prevBuyins.set(p.id, p.buyins);

    const totalBuy = S.players.reduce((a, p) => a + p.buyins, 0);
    $('total-money').textContent = `${M.currency}${fmt(totalBuy * M.buyIn)}`;
    const out = S.players.filter((p) => p.cashOut);
    let sub = `${totalBuy} buy-in${totalBuy === 1 ? '' : 's'} · ${n} player${n === 1 ? '' : 's'}`;
    if (out.length) {
      const cashedChips = out.reduce((a, p) => a + p.cashOut.chips, 0);
      sub += ` · ${out.length} cashed out<br>Chips still in play <b>${fmt(totalBuy * M.chipsPerBuyIn - cashedChips)}</b>`;
    }
    $('total-sub').innerHTML = sub;
    $('awards').innerHTML = awards().join('');
    tickClock();
  }

  // ---------- tiles + auto-scroll ----------
  const SCROLL_SPEED = 0.035; // share of the screen width travelled per second
  const TILE_ROWS = 2;        // rows of tiles in the strip
  let marquee = null;

  function tileHtml(p, isTop) {
    const cls = [
      p.buyins >= 3 ? 'heat-3' : p.buyins === 2 ? 'heat-2' : '',
      isTop ? 'top' : '',
      p.buyins === 0 ? 'zero' : '',
      p.cemented ? 'cement' : '',
      p.cashOut ? 'out' : '',
    ].join(' ');
    return `<div class="tile ${cls}" data-id="${p.id}">
      <div class="name">${esc(p.name)}</div>
      <div class="mid"><div class="n">${p.buyins}</div><div class="unit">${p.buyins === 1 ? 'buy-in' : 'buy-ins'}</div></div>
      <div class="amt">${p.cashOut ? cashLine(p) : M.currency + fmt(p.buyins * M.buyIn)}</div>
    </div>`;
  }

  function netOf(p) {
    return Math.round((p.cashOut.chips * M.buyIn) / M.chipsPerBuyIn) - p.buyins * M.buyIn;
  }
  function cashLine(p) {
    const net = netOf(p);
    const txt = net > 0 ? `+${M.currency}${fmt(net)}` : net < 0 ? `−${M.currency}${fmt(-net)}` : `${M.currency}0`;
    return `${fmt(p.cashOut.chips)} chips · <span class="net ${net > 0 ? 'pos' : net < 0 ? 'neg' : ''}">${txt}</span>`;
  }

  function renderTiles() {
    const board = $('board');
    const track = $('track');

    // Keep the scroll position across re-renders so a tap on the phone doesn't jump the strip.
    let progress = 0;
    if (marquee) {
      const d = marquee.effect.getTiming().duration;
      progress = (marquee.currentTime % d) / d;
      marquee.cancel();
      marquee = null;
    }

    if (!S.players.length) {
      board.classList.add('static');
      track.innerHTML = '<div class="empty" style="font-size:2.2vw;color:var(--muted)">No players yet — add them from your phone.</div>';
      return;
    }

    // Still playing first (most buy-ins leading), cashed-out players at the end.
    const sorted = [...S.players].sort((a, b) => !!a.cashOut - !!b.cashOut || b.buyins - a.buyins || a.id - b.id);
    const maxBuy = sorted[0].buyins;
    const topIsUnique = maxBuy >= 2 && sorted.filter((p) => p.buyins === maxBuy).length === 1;
    const html = sorted.map((p, i) => tileHtml(p, i === 0 && topIsUnique)).join('');

    board.style.setProperty('--tile-rows', Math.min(TILE_ROWS, sorted.length));
    track.innerHTML = `<div class="set">${html}</div>`;
    const fits = track.scrollWidth <= board.clientWidth;
    board.classList.toggle('static', fits);

    if (!fits) {
      // Two copies side by side; slide left by exactly one copy, then loop — seamless.
      track.innerHTML += `<div class="set" aria-hidden="true">${html}</div>`;
      const sets = track.children;
      const dist = sets[1].offsetLeft - sets[0].offsetLeft;
      const duration = (dist / (window.innerWidth * SCROLL_SPEED)) * 1000;
      // A window with no size yet (background tab, still opening) can't be measured —
      // skip the scroll for now; the resize handler starts it once the window has a size.
      if (!(duration > 0 && Number.isFinite(duration))) {
        track.lastElementChild.remove();
        return;
      }
      marquee = track.animate(
        [{ transform: 'translateX(0)' }, { transform: `translateX(${-dist}px)` }],
        { duration, iterations: Infinity }
      );
      marquee.currentTime = progress * duration;
    }

    for (const p of S.players) {
      const old = prevBuyins.get(p.id);
      if (old !== undefined && p.buyins > old) {
        for (const el of track.querySelectorAll(`[data-id="${p.id}"]`)) el.classList.add('bump');
      }
    }
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (S && S.mode === 'table') renderTiles(); }, 200);
  });

  function blindsText() {
    return [S.blinds.sb, S.blinds.bb, S.blinds.straddle].filter(Boolean).join(' / ');
  }

  function leader(score) {
    let best = null;
    let tie = false;
    for (const p of S.players) {
      const v = score(p);
      if (v <= 0) continue;
      if (!best || v > best.v) { best = { p, v }; tie = false; }
      else if (v === best.v) tie = true;
    }
    return best && !tie ? best : null;
  }

  function award(label, l) {
    return `<div class="award"><div class="label">${esc(label)}</div><div class="who">${esc(l.p.name)}<span>${l.v}</span></div></div>`;
  }

  function awards() {
    const out = [];
    const atm = leader((p) => (p.buyins >= 2 ? p.buyins : 0));
    if (atm) out.push(award('ATM of the night', atm));
    for (const a of M.playerActions || []) {
      const l = leader((p) => (p.counts && p.counts[a.event]) || 0);
      if (l) out.push(award(a.award || 'Most ' + a.label.toLowerCase(), l));
    }
    return out;
  }

  function tickClock() {
    $('now').textContent = new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
    if (S && S.startedAt) {
      const mins = Math.floor((Date.now() - S.startedAt) / 60000);
      $('elapsed').textContent = `${Math.floor(mins / 60)}:${String(mins % 60).padStart(2, '0')}`;
    } else {
      $('elapsed').textContent = '0:00';
    }
  }
  setInterval(tickClock, 15000);

  // ---------- scenes ----------
  const queue = [];
  let sceneTimer = null;
  let showing = false;

  function mediaHtml(src) {
    if (!src) return '';
    const url = /^https?:\/\//.test(src) || src.startsWith('/') ? src : '/' + src;
    return /\.(mp4|webm)$/i.test(url)
      ? `<video src="${esc(url)}" autoplay playsinline></video>`
      : `<img src="${esc(url)}" alt="">`;
  }

  function playScene(sc) {
    showing = true;
    const el = $('scene');
    el.className = `theme-${sc.theme || 'black'}`;
    $('scene-media').innerHTML = mediaHtml(sc.image || sc.video);
    const title = sc.title || '';
    $('scene-kicker').textContent = sc.kicker || '';
    $('scene-kicker').classList.toggle('hidden', !sc.kicker);
    $('scene-title').textContent = title;
    $('scene-title').className = 'title' + (title.length > 40 ? ' longer' : title.length > 18 ? ' long' : '');
    $('scene-subtitle').textContent = sc.subtitle || '';
    $('scene-subtitle').classList.toggle('hidden', !sc.subtitle);
    void el.offsetWidth;
    el.classList.add('show');
    if (sc.sound) Sounds.play(sc.sound);
    if (sc.confetti) confetti();

    const dur = Math.max(2, Number(sc.duration) || 6) * 1000;
    const bar = $('scene-bar');
    bar.style.transition = 'none';
    bar.style.transform = 'scaleX(1)';
    void bar.offsetWidth;
    bar.style.transition = `transform ${dur}ms linear`;
    bar.style.transform = 'scaleX(0)';

    clearTimeout(sceneTimer);
    sceneTimer = setTimeout(endScene, dur);
  }

  function endScene() {
    const el = $('scene');
    el.classList.add('leaving');
    setTimeout(() => {
      el.className = 'hidden';
      $('scene-media').innerHTML = '';
      showing = false;
      if (queue.length) playScene(queue.shift());
    }, 350);
  }

  function enqueue(sc) {
    if (showing) { if (queue.length < 4) queue.push(sc); }
    else playScene(sc);
  }

  function confetti() {
    const colors = ['#e8c26a', '#ff5a4e', '#3ad07a', '#5aa9ff', '#ffffff'];
    for (let i = 0; i < 90; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 2.2 + Math.random() * 2.5 + 's';
      c.style.animationDelay = Math.random() * 0.8 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6000);
    }
  }

  // ---------- shot clock ----------
  let clockTimer = null;
  function startClock({ seconds, name }) {
    clearInterval(clockTimer);
    const el = $('clock');
    el.className = '';
    $('clock-who').textContent = name ? `Clock is on ${name}` : 'Clock';
    const endsAt = Date.now() + seconds * 1000;
    let lastShown = null;
    const step = () => {
      const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      if (left === lastShown) return;
      lastShown = left;
      $('clock-left').textContent = left;
      el.classList.toggle('urgent', left <= 10 && left > 0);
      if (left <= 10 && left > 0) Sounds.play('tick');
      if (left === 0) {
        clearInterval(clockTimer);
        el.classList.add('done');
        $('clock-left').textContent = 'TIME';
        Sounds.play('buzzer');
        clockTimer = setTimeout(() => el.classList.add('hidden'), 3000);
      }
    };
    step();
    clockTimer = setInterval(step, 100);
  }

  function clearFx() {
    queue.length = 0;
    clearTimeout(sceneTimer);
    clearInterval(clockTimer);
    clearTimeout(clockTimer);
    $('clock').classList.add('hidden');
    if (showing) endScene();
  }

  // ---------- live connection ----------
  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => $('conn').classList.remove('off');
    es.onerror = () => $('conn').classList.add('off');
    es.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') {
        S = msg.state;
        M = msg.meta;
        render();
      } else if (msg.type === 'fx') {
        const f = msg.fx;
        if (f.kind === 'scene') enqueue(f.scene);
        else if (f.kind === 'sound') Sounds.play(f.sound);
        else if (f.kind === 'clock') startClock(f);
        else if (f.kind === 'clear') clearFx();
      }
    };
  }
  connect();
</script>
</body>
</html>
