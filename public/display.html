<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Night — Display</title>
<style>
  :root {
    --felt-1: #161616;
    --felt-2: #000000;
    --card: rgba(255, 255, 255, 0.06);
    --card-line: rgba(255, 255, 255, 0.10);
    --ink: #f4efe2;
    --muted: rgba(244, 239, 226, 0.62);
    --gold: #e8c26a;
    --hot-2: #f0a63a;
    --hot-3: #ff5a4e;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 30%, var(--felt-1), var(--felt-2) 75%);
    overflow: hidden;
    font-variant-numeric: tabular-nums;
    cursor: none;
  }
  .hidden { display: none !important; }

  /* ---------- start gate ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 100; cursor: pointer;
    display: grid; place-content: center; text-align: center; gap: 2vh;
    background: rgba(0, 0, 0, 0.82);
  }
  #gate h1 { font-size: 5vw; }
  #gate p { font-size: 1.6vw; color: var(--muted); }

  /* ---------- table view ---------- */
  #table { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 2.2vh 2.2vw; gap: 2.2vh; }
  header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  }
  .brand { font-size: 2.4vw; font-weight: 800; letter-spacing: 0.02em; }
  .brand .suits { color: var(--gold); margin-right: 0.6vw; }
  .blinds { text-align: center; }
  .blinds .label { font-size: 1vw; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
  .blinds .value { font-size: 4.4vw; font-weight: 800; line-height: 1; color: var(--gold); }
  .meta { justify-self: end; text-align: right; font-size: 1.5vw; color: var(--muted); line-height: 1.5; }
  .meta strong { color: var(--ink); font-weight: 700; }

  #grid { display: grid; gap: 1.6vh 1.2vw; min-height: 0; }
  .pcard {
    container-type: size;
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 1.4vw;
    padding: 1.6vh 1.4vw;
    display: grid; grid-template-rows: auto 1fr auto auto;
    min-height: 0; overflow: hidden;
    transition: transform 0.3s, background 0.3s;
  }
  .pcard .name { font-size: min(13cqh, 12cqw); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard .count { display: flex; align-items: baseline; gap: 3cqw; align-self: center; }
  .pcard .count .n { font-size: min(44cqh, 40cqw); font-weight: 900; line-height: 0.9; }
  .pcard .count .unit { font-size: min(9cqh, 8cqw); color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
  .pcard .money { font-size: min(9cqh, 8cqw); color: var(--muted); }
  .pcard .money strong { color: var(--ink); }
  .pcard .badges { display: flex; flex-wrap: wrap; gap: 2cqw; margin-top: 2.5cqh; min-height: 9cqh; }
  .badge { font-size: min(7cqh, 6cqw); padding: 0.6cqh 3cqw; border-radius: 99px; background: rgba(255,255,255,0.10); }
  .pcard.heat-2 .count .n { color: var(--hot-2); }
  .pcard.heat-3 .count .n { color: var(--hot-3); }
  .pcard .crown {
    position: absolute; top: 5cqh; right: 6cqw;
    font-size: min(7cqh, 6cqw); font-weight: 800; letter-spacing: 0.1em;
    color: #1a1206; background: var(--gold); padding: 0.8cqh 3cqw; border-radius: 99px;
  }
  .pcard.bump { animation: bump 0.9s ease; }
  @keyframes bump {
    0% { transform: scale(1); background: var(--card); }
    25% { transform: scale(1.06); background: rgba(232, 194, 106, 0.35); }
    100% { transform: scale(1); background: var(--card); }
  }

  footer {
    display: flex; justify-content: space-between; align-items: center; gap: 2vw;
    font-size: 1.6vw; color: var(--muted);
    border-top: 1px solid var(--card-line); padding-top: 1.6vh;
  }
  footer strong { color: var(--ink); }
  footer .awards { display: flex; gap: 2.5vw; }
  footer .awards span b { color: var(--gold); }
  .empty { display: grid; place-content: center; text-align: center; font-size: 2.2vw; color: var(--muted); }

  /* ---------- lobby / welcome ---------- */
  #lobby {
    height: 100vh; display: grid; place-content: center; text-align: center; gap: 3.5vh; padding: 4vw;
  }
  #lobby .suits { font-size: 4vw; letter-spacing: 1.2vw; color: var(--gold); }
  #lobby h1 { font-size: 9vw; font-weight: 900; line-height: 1; letter-spacing: -0.02em; }
  #lobby .date { font-size: 2.2vw; color: var(--muted); }
  #lobby .terms { font-size: 2.4vw; }
  #lobby .terms b { color: var(--gold); }
  #lobby .here-label { font-size: 1.2vw; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); margin-top: 2vh; }
  #lobby .here { display: flex; flex-wrap: wrap; justify-content: center; gap: 1vw; max-width: 80vw; }
  #lobby .here span {
    font-size: 2vw; font-weight: 600; padding: 0.8vh 1.6vw; border-radius: 99px;
    background: var(--card); border: 1px solid var(--card-line); animation: popin 0.5s ease both;
  }
  #lobby .url { position: fixed; bottom: 2vh; left: 0; right: 0; font-size: 1vw; color: var(--muted); }
  @keyframes popin { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ---------- scene overlay ---------- */
  #scene {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-content: center; text-align: center; gap: 3vh; padding: 5vw;
    background: var(--scene-bg, #111);
  }
  #scene.show { animation: scenein 0.45s cubic-bezier(.2,1.4,.4,1) both; }
  #scene.leaving { animation: sceneout 0.35s ease both; }
  @keyframes scenein { from { opacity: 0; transform: scale(1.15); } to { opacity: 1; transform: scale(1); } }
  @keyframes sceneout { to { opacity: 0; transform: scale(0.96); } }
  #scene .kicker { font-size: 2.6vw; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; }
  #scene .title.long { font-size: 6.5vw; }
  #scene .title.longer { font-size: 4.8vw; }
  #scene .title { font-size: 9vw; font-weight: 900; line-height: 0.95; letter-spacing: -0.02em; text-transform: none; }
  #scene .subtitle { font-size: 3.2vw; opacity: 0.85; }
  #scene .media img, #scene .media video { max-height: 48vh; max-width: 80vw; border-radius: 1.2vw; }
  #scene .bar { position: fixed; left: 0; bottom: 0; height: 1vh; background: rgba(255,255,255,0.55); width: 100%; transform-origin: left; }
  #scene.theme-red    { --scene-bg: radial-gradient(circle, #b3171b, #3d0406 80%); }
  #scene.theme-gold   { --scene-bg: radial-gradient(circle, #b8860b, #3b2a03 80%); }
  #scene.theme-green  { --scene-bg: radial-gradient(circle, #188a4f, #052716 80%); }
  #scene.theme-blue   { --scene-bg: radial-gradient(circle, #1f4f9e, #08142e 80%); }
  #scene.theme-purple { --scene-bg: radial-gradient(circle, #6b2fb3, #1b0833 80%); }
  #scene.theme-black  { --scene-bg: radial-gradient(circle, #2a2a2a, #000 80%); }
  #scene.theme-red .title { animation: pulse 0.6s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); text-shadow: 0 0 4vw rgba(255,200,200,0.6); } }

  .confetti { position: fixed; top: -5vh; width: 1vw; height: 1.8vw; z-index: 60; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }

  /* ---------- shot clock ---------- */
  #clock {
    position: fixed; inset: 0; z-index: 70; display: grid; place-content: center; text-align: center;
    background: radial-gradient(circle, #1b1b1b, #000 80%);
  }
  #clock .who { font-size: 3.6vw; font-weight: 700; color: var(--muted); }
  #clock .left { font-size: 34vh; font-weight: 900; line-height: 1; }
  #clock.urgent .left { color: var(--hot-3); animation: pulse 0.5s ease-in-out infinite alternate; }
  #clock.done { background: radial-gradient(circle, #b3171b, #3d0406 80%); }

  #conn { position: fixed; right: 1vw; bottom: 1vh; width: 0.8vw; height: 0.8vw; border-radius: 50%; background: #3ad07a; opacity: 0.5; z-index: 90; }
  #conn.off { background: #ff4d4d; opacity: 1; }
</style>
</head>
<body>

<div id="gate">
  <h1>♠ ♥ Poker Night ♦ ♣</h1>
  <p>Click anywhere to start — turns on sound, full screen and keeps the screen awake.</p>
  <p id="gate-url"></p>
</div>

<section id="lobby" class="hidden">
  <div class="suits">♠♥♦♣</div>
  <h1 id="lobby-title">Poker Night</h1>
  <div class="date" id="lobby-date"></div>
  <div class="terms" id="lobby-terms"></div>
  <div class="here-label" id="here-label">At the table</div>
  <div class="here" id="here"></div>
  <div class="url" id="lobby-url"></div>
</section>

<section id="table" class="hidden">
  <header>
    <div class="brand"><span class="suits">♠♥</span><span id="brand"></span></div>
    <div class="blinds"><div class="label">Blinds</div><div class="value" id="blinds"></div></div>
    <div class="meta">
      <div id="buyin-terms"></div>
      <div>Playing <strong id="elapsed">0:00</strong> · <span id="now"></span></div>
    </div>
  </header>
  <main id="grid"></main>
  <footer>
    <div>On the table <strong id="total-money"></strong> · <span id="total-chips"></span></div>
    <div class="awards" id="awards"></div>
  </footer>
</section>

<div id="scene" class="hidden">
  <div class="media" id="scene-media"></div>
  <div class="kicker" id="scene-kicker"></div>
  <div class="title" id="scene-title"></div>
  <div class="subtitle" id="scene-subtitle"></div>
  <div class="bar" id="scene-bar"></div>
</div>

<div id="clock" class="hidden">
  <div class="who" id="clock-who"></div>
  <div class="left" id="clock-left"></div>
</div>

<div id="conn" class="off"></div>

<script src="/sounds.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Number(n).toLocaleString('en-IN');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let S = null;     // server state
  let M = null;     // meta (config bits)
  const prevBuyins = new Map();

  // ---------- start gate ----------
  let wakeLock = null;
  async function keepAwake() {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wakeLock) keepAwake(); });

  $('gate').addEventListener('click', () => {
    Sounds.unlock();
    document.documentElement.requestFullscreen?.().catch(() => {});
    keepAwake();
    $('gate').classList.add('hidden');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
    }
    if (e.key === 'Escape') clearFx();
  });

  // ---------- render ----------
  function render() {
    if (!S) return;
    const lobby = S.mode === 'lobby';
    $('lobby').classList.toggle('hidden', !lobby);
    $('table').classList.toggle('hidden', lobby);
    const terms = `${M.currency}${fmt(M.buyIn)} buy-in = ${fmt(M.chipsPerBuyIn)} chips`;
    const url = M.controlUrls[0] ? `Control from your phone: ${M.controlUrls[0]}` : '';
    $('gate-url').textContent = url;

    if (lobby) {
      $('lobby-title').textContent = M.title;
      $('lobby-date').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
      $('lobby-terms').innerHTML = `Blinds <b>${S.blinds.sb} / ${S.blinds.bb}</b> · ${esc(terms)}`;
      $('here-label').textContent = S.players.length ? `At the table · ${S.players.length}` : 'Waiting for players…';
      $('here').innerHTML = S.players.map((p) => `<span>${esc(p.name)}</span>`).join('');
      $('lobby-url').textContent = url;
      return;
    }

    $('brand').textContent = M.title;
    $('blinds').textContent = `${S.blinds.sb} / ${S.blinds.bb}`;
    $('buyin-terms').textContent = terms;

    const n = S.players.length;
    const grid = $('grid');
    if (!n) {
      grid.style.gridTemplateColumns = '1fr';
      grid.style.gridTemplateRows = '1fr';
      grid.innerHTML = '<div class="empty">No players yet — add them from your phone.</div>';
    } else {
      const rows = n <= 4 ? 1 : n <= 10 ? 2 : 3;
      const cols = Math.ceil(n / rows);
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

      const maxBuy = Math.max(...S.players.map((p) => p.buyins));
      const leaders = S.players.filter((p) => p.buyins === maxBuy);
      const labels = Object.fromEntries((M.playerActions || []).map((a) => [a.event, a.label]));

      grid.innerHTML = S.players.map((p) => {
        const heat = p.buyins >= 3 ? 'heat-3' : p.buyins === 2 ? 'heat-2' : '';
        const crown = maxBuy >= 2 && leaders.length === 1 && leaders[0] === p ? '<div class="crown">ATM</div>' : '';
        const badges = Object.entries(p.counts || {})
          .filter(([ev, c]) => c > 0 && labels[ev])
          .map(([ev, c]) => `<span class="badge">${esc(labels[ev])} ×${c}</span>`).join('');
        return `<div class="pcard ${heat}" data-id="${p.id}">
          ${crown}
          <div class="name">${esc(p.name)}</div>
          <div class="count"><span class="n">${p.buyins}</span><span class="unit">${p.buyins === 1 ? 'buy-in' : 'buy-ins'}</span></div>
          <div class="money"><strong>${M.currency}${fmt(p.buyins * M.buyIn)}</strong> · ${fmt(p.buyins * M.chipsPerBuyIn)} chips</div>
          <div class="badges">${badges}</div>
        </div>`;
      }).join('');

      // flash cards whose buy-ins went up
      for (const p of S.players) {
        const before = prevBuyins.get(p.id);
        if (before !== undefined && p.buyins > before) {
          grid.querySelector(`[data-id="${p.id}"]`)?.classList.add('bump');
        }
      }
    }
    prevBuyins.clear();
    for (const p of S.players) prevBuyins.set(p.id, p.buyins);

    const totalBuy = S.players.reduce((a, p) => a + p.buyins, 0);
    $('total-money').textContent = `${M.currency}${fmt(totalBuy * M.buyIn)}`;
    $('total-chips').textContent = `${fmt(totalBuy * M.chipsPerBuyIn)} chips · ${n} player${n === 1 ? '' : 's'}`;
    $('awards').innerHTML = awards().join('');
    tickClock();
  }

  function leader(score) {
    let best = null;
    let tie = false;
    for (const p of S.players) {
      const v = score(p);
      if (v <= 0) continue;
      if (!best || v > best.v) { best = { p, v }; tie = false; }
      else if (v === best.v) tie = true;
    }
    return best && !tie ? best : null;
  }

  function awards() {
    const out = [];
    const atm = leader((p) => (p.buyins >= 2 ? p.buyins : 0));
    if (atm) out.push(`<span>ATM of the night: <b>${esc(atm.p.name)}</b> (${atm.v})</span>`);
    for (const a of M.playerActions || []) {
      const l = leader((p) => (p.counts && p.counts[a.event]) || 0);
      if (l) out.push(`<span>${esc(a.award || 'Most ' + a.label.toLowerCase())}: <b>${esc(l.p.name)}</b> (${l.v})</span>`);
    }
    return out.slice(0, 3);
  }

  function tickClock() {
    $('now').textContent = new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
    if (S && S.startedAt) {
      const mins = Math.floor((Date.now() - S.startedAt) / 60000);
      $('elapsed').textContent = `${Math.floor(mins / 60)}:${String(mins % 60).padStart(2, '0')}`;
    } else {
      $('elapsed').textContent = '0:00';
    }
  }
  setInterval(tickClock, 15000);

  // ---------- scenes ----------
  const queue = [];
  let sceneTimer = null;
  let showing = false;

  function mediaHtml(src) {
    if (!src) return '';
    const url = /^https?:\/\//.test(src) || src.startsWith('/') ? src : '/' + src;
    return /\.(mp4|webm)$/i.test(url)
      ? `<video src="${esc(url)}" autoplay playsinline></video>`
      : `<img src="${esc(url)}" alt="">`;
  }

  function playScene(sc) {
    showing = true;
    const el = $('scene');
    el.className = `theme-${sc.theme || 'black'}`;
    $('scene-media').innerHTML = mediaHtml(sc.image || sc.video);
    const title = sc.title || '';
    $('scene-kicker').textContent = sc.kicker || '';
    $('scene-kicker').classList.toggle('hidden', !sc.kicker);
    $('scene-title').textContent = title;
    $('scene-title').className = 'title' + (title.length > 40 ? ' longer' : title.length > 18 ? ' long' : '');
    $('scene-subtitle').textContent = sc.subtitle || '';
    $('scene-subtitle').classList.toggle('hidden', !sc.subtitle);
    void el.offsetWidth;
    el.classList.add('show');
    if (sc.sound) Sounds.play(sc.sound);
    if (sc.confetti) confetti();

    const dur = Math.max(2, Number(sc.duration) || 6) * 1000;
    const bar = $('scene-bar');
    bar.style.transition = 'none';
    bar.style.transform = 'scaleX(1)';
    void bar.offsetWidth;
    bar.style.transition = `transform ${dur}ms linear`;
    bar.style.transform = 'scaleX(0)';

    clearTimeout(sceneTimer);
    sceneTimer = setTimeout(endScene, dur);
  }

  function endScene() {
    const el = $('scene');
    el.classList.add('leaving');
    setTimeout(() => {
      el.className = 'hidden';
      $('scene-media').innerHTML = '';
      showing = false;
      if (queue.length) playScene(queue.shift());
    }, 350);
  }

  function enqueue(sc) {
    if (showing) { if (queue.length < 4) queue.push(sc); }
    else playScene(sc);
  }

  function confetti() {
    const colors = ['#e8c26a', '#ff5a4e', '#3ad07a', '#5aa9ff', '#ffffff'];
    for (let i = 0; i < 90; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 2.2 + Math.random() * 2.5 + 's';
      c.style.animationDelay = Math.random() * 0.8 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6000);
    }
  }

  // ---------- shot clock ----------
  let clockTimer = null;
  function startClock({ seconds, name }) {
    clearInterval(clockTimer);
    const el = $('clock');
    el.className = '';
    $('clock-who').textContent = name ? `Clock is on ${name}` : 'Clock';
    const endsAt = Date.now() + seconds * 1000;
    let lastShown = null;
    const step = () => {
      const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      if (left === lastShown) return;
      lastShown = left;
      $('clock-left').textContent = left;
      el.classList.toggle('urgent', left <= 10 && left > 0);
      if (left <= 10 && left > 0) Sounds.play('tick');
      if (left === 0) {
        clearInterval(clockTimer);
        el.classList.add('done');
        $('clock-left').textContent = 'TIME';
        Sounds.play('buzzer');
        clockTimer = setTimeout(() => el.classList.add('hidden'), 3000);
      }
    };
    step();
    clockTimer = setInterval(step, 100);
  }

  function clearFx() {
    queue.length = 0;
    clearTimeout(sceneTimer);
    clearInterval(clockTimer);
    clearTimeout(clockTimer);
    $('clock').classList.add('hidden');
    if (showing) endScene();
  }

  // ---------- live connection ----------
  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => $('conn').classList.remove('off');
    es.onerror = () => $('conn').classList.add('off');
    es.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') {
        S = msg.state;
        M = msg.meta;
        render();
      } else if (msg.type === 'fx') {
        const f = msg.fx;
        if (f.kind === 'scene') enqueue(f.scene);
        else if (f.kind === 'sound') Sounds.play(f.sound);
        else if (f.kind === 'clock') startClock(f);
        else if (f.kind === 'clear') clearFx();
      }
    };
  }
  connect();
</script>
</body>
</html>
