<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<title>Poker Night — Remote</title>
<style>
  :root {
    --bg: #000000;
    --panel: #121212;
    --panel-2: #222222;
    --line: rgba(255, 255, 255, 0.09);
    --ink: #f4efe2;
    --muted: rgba(244, 239, 226, 0.6);
    --gold: #e8c26a;
    --red: #e5484d;
    --green: #2fb36d;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body {
    font-family: var(--font); color: var(--ink); font-size: 16px;
    font-variant-numeric: tabular-nums;
    padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(0.96); }
  input { font: inherit; }

  .top {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .top .title { font-weight: 800; flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .top .title small { font-weight: 500; color: var(--muted); white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex: none; }
  .dot.off { background: var(--red); }
  .chip-btn { padding: 8px 12px; border-radius: 10px; background: var(--panel-2); font-size: 14px; font-weight: 600; }
  .chip-btn[disabled] { opacity: 0.35; }

  main { padding: 12px 16px; display: grid; gap: 12px; }
  .tab { display: none; gap: 12px; }
  .tab.active { display: grid; }

  .add { display: flex; gap: 8px; }
  .add input {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
  }
  .add button { padding: 0 18px; border-radius: 12px; background: var(--gold); color: #1a1206; font-weight: 700; }

  .player { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
  .prow { display: flex; align-items: center; gap: 10px; }
  .pname { flex: 1; min-width: 0; font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pname small { display: block; font-weight: 500; font-size: 13px; color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button { width: 44px; height: 44px; border-radius: 12px; background: var(--panel-2); font-size: 22px; font-weight: 700; }
  .stepper button.plus { background: var(--gold); color: #1a1206; }
  .stepper .n { min-width: 34px; text-align: center; font-size: 22px; font-weight: 800; }
  .more { width: 36px; height: 44px; border-radius: 10px; background: transparent; color: var(--muted); font-size: 20px; }
  #players { display: grid; gap: 10px; }
  .acts { display: flex; flex-wrap: wrap; gap: 5px; }
  .acts button { flex: 1 1 auto; padding: 9px 5px; border-radius: 10px; background: var(--panel-2); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acts button.allin { background: rgba(229, 72, 77, 0.22); color: #ffb3b5; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid button { min-height: 64px; padding: 8px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; font-size: 15px; }
  h2 { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--panel); padding: 4px; border-radius: 12px; }
  .seg button { padding: 12px; border-radius: 9px; font-weight: 700; background: transparent; color: var(--muted); }
  .seg button.on { background: var(--gold); color: #1a1206; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { width: 80px; padding: 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); text-align: center; }
  .wide { width: 100%; padding: 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; }
  .danger { color: #ffb3b5; }
  .msg { display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .msg input, .msg select {
    width: 100%; padding: 12px 14px; border-radius: 12px; font-size: 16px;
    background: var(--bg); border: 1px solid var(--line); color: var(--ink);
  }
  .swatches { display: flex; gap: 8px; }
  .swatches button { flex: 1; height: 36px; border-radius: 10px; border: 2px solid transparent; }
  .swatches button.on { border-color: var(--ink); }
  .send { padding: 14px; border-radius: 12px; background: var(--gold); color: #1a1206; font-weight: 800; }
  .msg .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .msg .save { padding: 14px; border-radius: 12px; background: var(--panel-2); font-weight: 700; }
  .h2row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
  .h2row h2 { margin-top: 0; }
  .edit-link { background: none; color: var(--gold); font-size: 14px; font-weight: 700; padding: 4px; }
  .grid button.mine { border-left: 5px solid var(--c, #2a2a2a); text-align: left; padding-left: 12px; overflow: hidden; text-overflow: ellipsis; }
  .grid.editing button { border: 2px dashed var(--red); color: #ffb3b5; }
  .grid button.add-sound { border: 2px dashed var(--line); color: var(--gold); background: transparent; }
  .grid .hint { grid-column: 1 / -1; }
  .acts button.cement.on { background: #8b877e; color: #141412; }
  .tag { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 99px; background: #8b877e; color: #141412; vertical-align: middle; }
  .hidden { display: none !important; }
  #sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.6); display: flex; align-items: flex-end; }
  #sheet .panel { width: 100%; background: var(--panel); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: grid; gap: 8px; }
  #sheet .sheet-title { font-weight: 800; font-size: 18px; padding: 4px 4px 8px; }
  #sheet .sheet-sub { color: var(--muted); font-size: 14px; padding: 0 4px 6px; margin-top: -6px; }
  #sheet input { width: 100%; padding: 16px; border-radius: 12px; font: inherit; font-size: 24px; font-weight: 800; text-align: center; background: var(--bg); border: 1px solid var(--line); color: var(--ink); }
  #sheet .preview { text-align: center; font-size: 15px; color: var(--muted); min-height: 20px; }
  #sheet .primary { background: var(--gold); color: #1a1206; text-align: center; }
  .pos { color: #3ad07a; } .neg { color: #ff8a8d; }
  .player.out { opacity: 0.75; border-style: dashed; }
  .tag.out { background: #3ad07a; color: #04170c; }
  #sheet button { padding: 15px; border-radius: 12px; background: var(--panel-2); font-weight: 700; text-align: left; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .empty { text-align: center; padding: 28px 12px; color: var(--muted); }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: grid; grid-template-columns: repeat(3, 1fr) auto;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); gap: 6px;
    background: rgba(0, 0, 0, 0.94); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
  }
  nav button { padding: 12px 4px; border-radius: 12px; background: transparent; color: var(--muted); font-weight: 700; }
  nav button.on { background: var(--panel-2); color: var(--ink); }
  nav .clear { background: var(--red); color: #fff; padding: 12px 14px; }

  #toast {
    position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #000; color: #fff; padding: 10px 16px; border-radius: 99px; font-size: 14px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 9; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 0.92; }
</style>
</head>
<body>

<div class="top">
  <span class="dot off" id="dot"></span>
  <div class="title"><span id="title">Poker Night</span> <small id="blinds-small"></small></div>
  <button class="chip-btn" id="undo" disabled>↶ Undo</button>
</div>

<main>
  <!-- PLAYERS -->
  <section class="tab active" id="tab-players">
    <form class="add" id="add-form" autocomplete="off">
      <input id="add-name" placeholder="Add player" maxlength="24" autocapitalize="words" enterkeyhint="done">
      <button type="submit">Add</button>
    </form>
    <div id="players"></div>
  </section>

  <!-- CUSTOM -->
  <section class="tab" id="tab-custom">
    <h2>New message</h2>
    <form class="msg" id="msg-form" autocomplete="off">
      <input id="msg-title" placeholder="Big text on the monitor" maxlength="80" enterkeyhint="send">
      <input id="msg-sub" placeholder="Smaller line underneath (optional)" maxlength="120" enterkeyhint="send">
      <div class="swatches" id="msg-theme">
        <button type="button" data-theme="black" style="background:#2a2a2a" class="on" aria-label="Black"></button>
        <button type="button" data-theme="red" style="background:#b3171b" aria-label="Red"></button>
        <button type="button" data-theme="gold" style="background:#b8860b" aria-label="Gold"></button>
        <button type="button" data-theme="green" style="background:#188a4f" aria-label="Green"></button>
        <button type="button" data-theme="blue" style="background:#1f4f9e" aria-label="Blue"></button>
        <button type="button" data-theme="purple" style="background:#6b2fb3" aria-label="Purple"></button>
      </div>
      <select id="msg-sound"></select>
      <div class="btns">
        <button class="send" type="submit">Show now</button>
        <button class="save" type="button" id="msg-save">Save as button</button>
      </div>
    </form>

    <div class="h2row"><h2>My buttons</h2><button class="edit-link" data-edit="buttons">Edit</button></div>
    <div class="grid" id="my-buttons"></div>

    <div class="h2row"><h2>My sounds</h2><button class="edit-link" data-edit="sounds">Edit</button></div>
    <div class="grid" id="my-sounds"></div>
    <input type="file" id="sound-file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac" hidden>

    <h2>Built-in sounds</h2>
    <div class="grid" id="soundboard"></div>
    <h2>Announcements</h2>
    <div class="grid" id="announcements"></div>
  </section>

  <!-- SCREEN -->
  <section class="tab" id="tab-screen">
    <h2>Monitor shows</h2>
    <div class="seg" id="mode">
      <button data-mode="lobby">Welcome screen</button>
      <button data-mode="table">Buy-in board</button>
    </div>

    <h2>Shot clock</h2>
    <div class="grid" id="clock-btns">
      <button data-s="30">30 s</button>
      <button data-s="60">60 s</button>
      <button data-s="120">2 min</button>
    </div>

    <h2>Blinds</h2>
    <div class="row">
      <input id="sb" type="number" inputmode="numeric" min="1" aria-label="Small blind" placeholder="SB">
      <span>/</span>
      <input id="bb" type="number" inputmode="numeric" min="1" aria-label="Big blind" placeholder="BB">
      <span>/</span>
      <input id="straddle" type="number" inputmode="numeric" min="0" aria-label="Straddle (optional)" placeholder="Str.">
    </div>
    <p class="hint">Third box is the straddle — leave it empty for none.</p>
    <button class="wide" id="set-blinds">Update blinds</button>

    <h2>Night</h2>
    <button class="wide danger" id="reset">Reset night (clears all players)</button>
    <button class="wide" id="logout">Log out of this phone</button>
    <p class="hint" id="urls"></p>
  </section>
</main>

<nav>
  <button class="on" data-tab="players">Players</button>
  <button data-tab="custom">Custom</button>
  <button data-tab="screen">Screen</button>
  <button class="clear" id="clear" title="Clear the monitor">✕</button>
</nav>

<div id="toast"></div>

<div id="sheet" class="hidden">
  <div class="panel">
    <div class="sheet-title" id="sheet-title"></div>
    <div class="sheet-sub" id="sheet-sub"></div>
    <div id="sheet-menu" style="display:grid; gap:8px">
    <button type="button" data-s="cashout" id="sheet-cashout">Cash out — enter final chips</button>
    <button type="button" data-s="backin" id="sheet-backin">Back in the game</button>
    <button type="button" data-s="welcome" id="sheet-welcome">Show welcome screen</button>
    <button type="button" data-s="rename">Rename</button>
    <button type="button" data-s="remove" class="danger">Remove from table</button>
    <button type="button" data-s="cancel">Cancel</button>
    </div>
    <form id="cash-form" class="hidden" style="display:grid; gap:8px" autocomplete="off">
      <input id="cash-chips" type="number" inputmode="numeric" min="0" step="1" placeholder="Final chips" aria-label="Final chip count">
      <div class="preview" id="cash-preview"></div>
      <button type="submit" class="primary">Save cash-out</button>
      <button type="button" data-s="cancel">Cancel</button>
    </form>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => Number(n).toLocaleString('en-IN');
  const buzz = () => navigator.vibrate && navigator.vibrate(12);

  let S = null;
  let M = null;

  const toLogin = () => location.replace('/login');

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  async function act(action, payload = {}) {
    buzz();
    try {
      const res = await fetch('/api/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, ...payload }),
      });
      const data = await res.json();
      if (res.status === 401) return toLogin();
      if (!data.ok) toast(data.error || 'Something went wrong');
      return data;
    } catch {
      toast('Not connected to the laptop');
      return null;
    }
  }

  // ---------- render ----------
  function render() {
    if (!S) return;
    $('title').textContent = M.title;
    $('blinds-small').textContent = [S.blinds.sb, S.blinds.bb, S.blinds.straddle].filter(Boolean).join('/');
    $('undo').disabled = !M.canUndo;

    const list = $('players');
    if (!S.players.length) {
      list.innerHTML = '<div class="empty">No one at the table yet.<br>Add players above — each starts with one buy-in.</div>';
    } else {
      list.innerHTML = S.players.map((p) => p.cashOut ? `
        <div class="player out" data-id="${p.id}">
          <div class="prow">
            <div class="pname">${esc(p.name)}<span class="tag out">CASHED OUT</span><small>${p.buyins} buy-in${p.buyins === 1 ? '' : 's'} · ${fmt(p.cashOut.chips)} chips · ${netHtml(p, p.cashOut.chips)}</small></div>
            <button class="more" data-act="more" aria-label="More options">⋯</button>
          </div>
        </div>` : `
        <div class="player" data-id="${p.id}">
          <div class="prow">
            <div class="pname">${esc(p.name)}${p.cemented ? '<span class="tag">🧱 CEMENT</span>' : ''}<small>${M.currency}${fmt(p.buyins * M.buyIn)} · ${fmt(p.buyins * M.chipsPerBuyIn)} chips</small></div>
            <div class="stepper">
              <button data-act="minus" aria-label="Remove a buy-in">−</button>
              <span class="n">${p.buyins}</span>
              <button class="plus" data-act="plus" aria-label="Add a buy-in">+</button>
            </div>
            <button class="more" data-act="more" aria-label="More options">⋯</button>
          </div>
          <div class="acts">
            ${(M.playerActions || []).map((a) => `<button class="${a.event === 'allin' ? 'allin' : ''}" data-act="event" data-event="${esc(a.event)}">${esc(a.label)}</button>`).join('')}
            <button data-act="clock">Clock</button>
            <button class="cement ${p.cemented ? 'on' : ''}" data-act="cement">Cement</button>
          </div>
        </div>`).join('');
    }

    const sel = $('msg-sound');
    const keep = sel.value;
    const opts = (list) => list.map((s) => `<option value="${esc(s.sound)}">${esc(s.label)}</option>`).join('');
    sel.innerHTML = '<option value="">No sound</option>'
      + (M.customSounds.length ? `<optgroup label="My sounds">${opts(M.customSounds)}</optgroup>` : '')
      + `<optgroup label="Built-in">${opts(M.soundboard || [])}</optgroup>`;
    if (keep) sel.value = keep;

    $('my-buttons').innerHTML = M.buttons.length
      ? M.buttons.map((b) => `<button class="mine" data-id="${esc(b.id)}" style="--c:${THEME_COLORS[b.theme] || '#2a2a2a'}">${esc(b.title)}</button>`).join('')
      : '<p class="hint">Type a message above and tap “Save as button” — it stays here for every game.</p>';
    $('my-sounds').innerHTML = M.customSounds.map((s) => `<button data-file="${esc(s.file)}" data-sound="${esc(s.sound)}">${esc(s.label)}</button>`).join('')
      + (editing.sounds ? '' : '<button class="add-sound" data-add="1">＋ Add sound</button>');
    for (const k of ['buttons', 'sounds']) {
      $(k === 'buttons' ? 'my-buttons' : 'my-sounds').classList.toggle('editing', editing[k]);
      document.querySelector(`[data-edit="${k}"]`).textContent = editing[k] ? 'Done' : 'Edit';
    }
    $('soundboard').innerHTML = (M.soundboard || []).map((s, i) => `<button data-i="${i}">${esc(s.label)}</button>`).join('');
    $('announcements').innerHTML = (M.announcements || []).map((a, i) => `<button data-i="${i}">${esc(a.label)}</button>`).join('');

    for (const b of $('mode').children) b.classList.toggle('on', b.dataset.mode === S.mode);
    if (![$('sb'), $('bb'), $('straddle')].includes(document.activeElement)) {
      $('sb').value = S.blinds.sb;
      $('bb').value = S.blinds.bb;
      $('straddle').value = S.blinds.straddle || '';
    }
    $('logout').classList.toggle('hidden', !M.loginEnabled);
    $('urls').textContent = M.controlUrls.length
      ? `Monitor: open /display on the laptop. Remote: ${M.controlUrls.join(' or ')}`
      : '';
  }

  // ---------- events ----------
  $('add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('add-name').value.trim();
    if (!name) return;
    const r = await act('addPlayer', { name });
    if (r && r.ok) $('add-name').value = '';
  });

  $('players').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const id = Number(btn.closest('.player').dataset.id);
    const p = S.players.find((x) => x.id === id);
    switch (btn.dataset.act) {
      case 'plus': return act('buyin', { id, delta: 1 });
      case 'minus': return act('buyin', { id, delta: -1 });
      case 'event': return act('trigger', { id, event: btn.dataset.event });
      case 'clock': return act('clock', { id, seconds: 30 });
      case 'cement': return act('toggleCement', { id });
      case 'more': return openSheet(p);
    }
  });

  // ---------- player options sheet ----------
  let sheetPlayer = null;

  // Final chips → result against what they bought in, e.g. "+₹700".
  function netHtml(p, chips) {
    const net = Math.round((chips * M.buyIn) / M.chipsPerBuyIn) - p.buyins * M.buyIn;
    const txt = net > 0 ? `+${M.currency}${fmt(net)}` : net < 0 ? `−${M.currency}${fmt(-net)}` : `${M.currency}0`;
    return `<span class="${net > 0 ? 'pos' : net < 0 ? 'neg' : ''}">${txt}</span>`;
  }

  function openSheet(p) {
    sheetPlayer = p;
    $('sheet-title').textContent = p.name;
    $('sheet-sub').textContent = `In for ${M.currency}${fmt(p.buyins * M.buyIn)} · ${fmt(p.buyins * M.chipsPerBuyIn)} chips`;
    $('sheet-cashout').textContent = p.cashOut ? `Change final chips (${fmt(p.cashOut.chips)})` : 'Cash out — enter final chips';
    $('sheet-backin').classList.toggle('hidden', !p.cashOut);
    $('sheet-welcome').classList.toggle('hidden', Boolean(p.cashOut));
    $('sheet-menu').classList.remove('hidden');
    $('cash-form').classList.add('hidden');
    $('sheet').classList.remove('hidden');
  }
  function closeSheet() {
    $('sheet').classList.add('hidden');
    $('cash-chips').blur();
  }

  function updateCashPreview() {
    const p = sheetPlayer;
    const v = $('cash-chips').value;
    if (!p || v === '') return ($('cash-preview').innerHTML = '');
    const value = Math.round((Number(v) * M.buyIn) / M.chipsPerBuyIn);
    $('cash-preview').innerHTML = `= ${M.currency}${fmt(value)} · ${netHtml(p, Number(v))}`;
  }
  $('cash-chips').addEventListener('input', updateCashPreview);
  $('cash-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const p = sheetPlayer;
    const chips = $('cash-chips').value.trim();
    if (chips === '') return toast('Enter the final chip count');
    const r = await act('cashOut', { id: p.id, chips: Number(chips) });
    if (r && r.ok) {
      closeSheet();
      toast(`${p.name} cashed out`);
    }
  });

  $('sheet').addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (b && b.type === 'submit' && b.form) return; // the chip form's Save is handled by its submit listener
    if (!b && e.target !== $('sheet')) return;
    const p = sheetPlayer;
    if (b && b.dataset.s === 'cashout') {
      $('sheet-menu').classList.add('hidden');
      $('cash-form').classList.remove('hidden');
      $('cash-chips').value = p.cashOut ? p.cashOut.chips : '';
      updateCashPreview();
      $('cash-chips').focus();
      return;
    }
    closeSheet();
    if (!b || !p) return;
    if (b.dataset.s === 'backin') act('undoCashOut', { id: p.id });
    if (b.dataset.s === 'welcome') act('welcome', { id: p.id });
    if (b.dataset.s === 'rename') {
      const name = prompt(`Rename ${p.name}`, p.name);
      if (name && name.trim() && name.trim() !== p.name) act('renamePlayer', { id: p.id, name });
    }
    if (b.dataset.s === 'remove' && confirm(`Remove ${p.name} from the table? (Undo can bring them back.)`)) {
      act('removePlayer', { id: p.id });
    }
  });

  // ---------- custom tab ----------
  const THEME_COLORS = { black: '#2a2a2a', red: '#b3171b', gold: '#b8860b', green: '#188a4f', blue: '#1f4f9e', purple: '#6b2fb3' };
  const editing = { buttons: false, sounds: false };
  let msgTheme = 'black';

  function readMsg() {
    return { title: $('msg-title').value.trim(), subtitle: $('msg-sub').value.trim(), theme: msgTheme, sound: $('msg-sound').value };
  }
  function clearMsg() {
    $('msg-title').value = '';
    $('msg-sub').value = '';
    document.activeElement.blur();
  }

  $('msg-theme').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    msgTheme = b.dataset.theme;
    for (const x of $('msg-theme').children) x.classList.toggle('on', x === b);
  });
  $('msg-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const m = readMsg();
    if (!m.title) return toast('Type a message first');
    const r = await act('custom', m);
    if (r && r.ok) clearMsg();
  });
  $('msg-save').addEventListener('click', async () => {
    const m = readMsg();
    if (!m.title) return toast('Type a message first');
    const r = await act('saveButton', m);
    if (r && r.ok) { clearMsg(); toast('Saved to My buttons'); }
  });

  document.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => {
    editing[b.dataset.edit] = !editing[b.dataset.edit];
    render();
  }));

  $('my-buttons').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (editing.buttons) {
      if (confirm(`Delete the “${b.textContent}” button?`)) act('deleteButton', { id: b.dataset.id });
    } else {
      act('playButton', { id: b.dataset.id });
    }
  });

  $('my-sounds').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.add) return $('sound-file').click();
    if (editing.sounds) {
      if (confirm(`Delete the sound “${b.textContent}”?`)) act('deleteSound', { file: b.dataset.file });
    } else {
      act('sound', { sound: b.dataset.sound });
    }
  });

  $('sound-file').addEventListener('change', async () => {
    const file = $('sound-file').files[0];
    $('sound-file').value = '';
    if (!file) return;
    if (file.size > 15 * 1024 * 1024) return toast('That file is over 15 MB');
    toast(`Uploading ${file.name}…`);
    try {
      const res = await fetch(`/api/upload?name=${encodeURIComponent(file.name)}`, { method: 'POST', body: file });
      if (res.status === 401) return toLogin();
      const d = await res.json();
      toast(d.ok ? 'Sound added — tap it to play' : d.error || 'Upload failed');
    } catch {
      toast('Upload failed — is the laptop on?');
    }
  });

  $('undo').addEventListener('click', async () => {
    const r = await act('undo');
    if (r && r.ok) toast(`Undid: ${r.undone}`);
  });
  $('clear').addEventListener('click', () => act('clearFx'));

  $('soundboard').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) act('sound', { sound: M.soundboard[b.dataset.i].sound });
  });
  $('announcements').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) act('announce', { index: Number(b.dataset.i) });
  });
  $('mode').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) act('setMode', { mode: b.dataset.mode });
  });
  $('clock-btns').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) act('clock', { seconds: Number(b.dataset.s) });
  });
  $('set-blinds').addEventListener('click', async () => {
    const r = await act('setBlinds', { sb: $('sb').value, bb: $('bb').value, straddle: $('straddle').value });
    if (r && r.ok) { document.activeElement.blur(); toast('Blinds updated'); }
  });
  $('logout').addEventListener('click', async () => {
    if (!confirm('Log out of the remote on this phone?')) return;
    await fetch('/api/logout', { method: 'POST' }).catch(() => {});
    toLogin();
  });
  $('reset').addEventListener('click', () => {
    if (confirm('Reset the night? All players and buy-ins are cleared (Undo can bring them back).')) act('resetNight');
  });

  document.querySelector('nav').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    buzz();
    for (const x of document.querySelectorAll('nav button[data-tab]')) x.classList.toggle('on', x === b);
    for (const t of document.querySelectorAll('.tab')) t.classList.toggle('active', t.id === `tab-${b.dataset.tab}`);
    window.scrollTo(0, 0);
  });

  // ---------- live connection ----------
  let loadedVersion = null;
  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => $('dot').classList.remove('off');
    es.onerror = () => $('dot').classList.add('off');
    es.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') {
        S = msg.state;
        M = msg.meta;
        // The code on the laptop changed — reload so this phone never runs an old remote.
        if (loadedVersion && M.assetVersion !== loadedVersion) return location.reload();
        loadedVersion = M.assetVersion;
        render();
      }
    };
  }
  connect();
</script>
</body>
</html>
